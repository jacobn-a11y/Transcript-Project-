<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- App background - rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Shadow under body -->
  <ellipse cx="268" cy="380" rx="120" ry="18" fill="#3730a3" opacity="0.3"/>

  <!-- Noo-noo body - main dome/barrel shape -->
  <ellipse cx="268" cy="300" rx="130" ry="85" fill="url(#body)"/>

  <!-- Top dome highlight -->
  <ellipse cx="268" cy="268" rx="105" ry="58" fill="url(#dome)"/>

  <!-- Body shine -->
  <ellipse cx="240" cy="255" rx="50" ry="20" fill="white" opacity="0.2"/>

  <!-- Trunk/hose extending left and curving up -->
  <path d="M 155 280 C 110 270 80 240 65 195 C 55 165 60 145 75 135"
        stroke="#38bdf8" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M 155 280 C 110 270 80 240 65 195 C 55 165 60 145 75 135"
        stroke="#7dd3fc" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Trunk tip (suction nozzle) -->
  <ellipse cx="78" cy="128" rx="22" ry="14" fill="#0ea5e9" transform="rotate(-30, 78, 128)"/>
  <ellipse cx="78" cy="128" rx="16" ry="9" fill="#0c4a6e" transform="rotate(-30, 78, 128)"/>

  <!-- Transcript pages being sucked toward trunk -->
  <g transform="rotate(-20, 55, 90)">
    <rect x="30" y="68" width="36" height="44" rx="3" fill="white" opacity="0.95"/>
    <line x1="37" y1="78" x2="59" y2="78" stroke="#c7d2fe" stroke-width="2.5"/>
    <line x1="37" y1="85" x2="55" y2="85" stroke="#c7d2fe" stroke-width="2.5"/>
    <line x1="37" y1="92" x2="57" y2="92" stroke="#c7d2fe" stroke-width="2.5"/>
    <line x1="37" y1="99" x2="52" y2="99" stroke="#c7d2fe" stroke-width="2.5"/>
  </g>

  <g transform="rotate(10, 40, 75)" opacity="0.7">
    <rect x="10" y="55" width="30" height="38" rx="3" fill="white"/>
    <line x1="16" y1="64" x2="34" y2="64" stroke="#c7d2fe" stroke-width="2"/>
    <line x1="16" y1="70" x2="30" y2="70" stroke="#c7d2fe" stroke-width="2"/>
    <line x1="16" y1="76" x2="32" y2="76" stroke="#c7d2fe" stroke-width="2"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="240" cy="275" rx="20" ry="24" fill="white"/>
  <ellipse cx="300" cy="275" rx="20" ry="24" fill="white"/>

  <!-- Pupils -->
  <circle cx="244" cy="278" r="11" fill="#1e293b"/>
  <circle cx="304" cy="278" r="11" fill="#1e293b"/>

  <!-- Eye highlights -->
  <circle cx="248" cy="273" r="5" fill="white"/>
  <circle cx="308" cy="273" r="5" fill="white"/>

  <!-- Happy mouth -->
  <path d="M 248 305 Q 270 322 295 305" stroke="#0c4a6e" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="222" cy="300" rx="14" ry="8" fill="#f9a8d4" opacity="0.4"/>
  <ellipse cx="322" cy="300" rx="14" ry="8" fill="#f9a8d4" opacity="0.4"/>

  <!-- Small wheels at bottom -->
  <rect x="200" y="365" width="36" height="16" rx="8" fill="#1e3a5f" opacity="0.7"/>
  <rect x="300" y="365" width="36" height="16" rx="8" fill="#1e3a5f" opacity="0.7"/>

  <!-- Antenna/bump on top -->
  <circle cx="268" cy="208" r="10" fill="#38bdf8"/>
  <circle cx="268" cy="208" r="6" fill="#7dd3fc"/>
</svg>
